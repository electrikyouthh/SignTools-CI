version: v1.0
name: CI
agent:
  machine:
    type: a2-standard-4
    os_image: macos-xcode26
execution_time_limit:
  minutes: 30
blocks:
  - name: Sign
    task:
      jobs:
        - name: Sign
          commands:
            - checkout
            - nvm install 20
            - cache restore session
            - PYTHONUNBUFFERED=1 ./sign.py
            - cache delete session
            - cache store session ~/.fastlane
  - name: 'Block #2'
    task:
      jobs:
        - name: 'Job #1'
          commands: []
after_pipeline:
  task:
    jobs:
      - name: 'Job #1'
        commands: []
promotions:
  - name: Promotion 1
    pipeline_file: pipeline_2.yml
